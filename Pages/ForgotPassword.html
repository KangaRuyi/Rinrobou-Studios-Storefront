<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../output.css">
    <link rel="icon" type="image/png" href="../src/assets/logo-small.png">
    <title>Forgot Password</title>
</head>


<body>
    <main class="forgotPassword-background">
        <div class="forgotPassword-Q">
            <h1>Forgot Password?</h1>
        </div>

        <div class="forgotPasswordContainer">
            <p>Enter the email used for your</p>
            <p> account and we will send you</p>
            <p> a link to reset your password</p>

            <label class="infoContainer">
                <input id="email" name="email" type="email" placeholder="Enter your email" required>
            </label>
            <div class="infoContainer">
                <button type="submit">Reset Password</button>
            </div>
        </div>
    </main>
</body>

</html>
